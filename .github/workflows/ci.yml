name: Foundation CI
on:
  push:
    branches: [main, 'codex/**']
    tags: ['relay/v*', 'firmware/board-check/v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
concurrency:
  group: foundation-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version: '1.26.8'
          cache-dependency-path: services/relay/go.sum
      - name: Install workflow checker
        run: go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
      - name: Host and repository checks
        run: ./tools/validate.sh --static
      - name: Validate isolated Compose configuration
        env:
          POCKETLINK_IMAGE: pocketlink-relay:ci
        run: docker compose -f deploy/compose.yaml config --quiet

  firmware:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    container:
      image: espressif/idf:v5.5.3
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Compile and verify protected layout
        shell: bash
        run: |
          source /opt/esp/idf/export.sh
          ./tools/validate.sh --firmware
          git diff --exit-code -- firmware/apps/board-check/dependencies.lock
          cd dist/firmware/board-check
          sha256sum FoloToy-AI-Passport-full.bin > SHA256SUMS
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: board-check-${{ github.sha }}
          path: dist/firmware/board-check/
          if-no-files-found: error
          retention-days: 14

  image:
    needs: [checks, firmware]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f
      - name: Image identity
        id: identity
        env:
          OWNER: ${{ github.repository_owner }}
        run: echo "name=ghcr.io/${OWNER,,}/pocketlink-relay" >> "$GITHUB_OUTPUT"
      - name: Build native smoke image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8
        with:
          context: .
          file: services/relay/Dockerfile
          platforms: linux/amd64
          load: true
          tags: pocketlink-relay:smoke-amd64
          build-args: VERSION=${{ github.sha }}
          cache-from: type=gha,scope=relay
          cache-to: type=gha,mode=max,scope=relay
      - name: Smoke native container
        run: ./tools/smoke-container.sh pocketlink-relay:smoke-amd64 linux/amd64
      - name: Build arm64 smoke image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8
        with:
          context: .
          file: services/relay/Dockerfile
          platforms: linux/arm64
          load: true
          tags: pocketlink-relay:smoke-arm64
          build-args: VERSION=${{ github.sha }}
          cache-from: type=gha,scope=relay
      - name: Smoke arm64 container
        run: ./tools/smoke-container.sh pocketlink-relay:smoke-arm64 linux/arm64
      - name: Login to GHCR
        if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/relay/v'))
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Image tags
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051
        with:
          images: ${{ steps.identity.outputs.name }}
          tags: |
            type=raw,value=edge,enable={{is_default_branch}}
            type=sha,format=long
            type=match,pattern=relay/v(.*),group=1
          flavor: latest=false
      - name: Publish validated multi-architecture image
        if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/relay/v'))
        id: publish
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8
        with:
          context: .
          file: services/relay/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: VERSION=${{ github.sha }}
          cache-from: type=gha,scope=relay
          provenance: mode=max
          sbom: true
      - name: Record published digest
        if: steps.publish.outputs.digest != ''
        env:
          IMAGE: ${{ steps.identity.outputs.name }}
          DIGEST: ${{ steps.publish.outputs.digest }}
        run: echo "Published ${IMAGE}@${DIGEST}" >> "$GITHUB_STEP_SUMMARY"
