<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>PocketLink · 消息管理</title><link rel="stylesheet" href="/assets/style.css"><script defer src="/assets/app.js"></script></head>
<body><main><header><span class="brand">POCKETLINK</span><span class="badge">设备管理</span></header>
<h1>让口袋里的设备连起来。</h1><p class="intro">管理设备与房间，发送文字并查看接收回执。</p>
<p id="status" role="status" aria-live="polite"></p>
<section id="login"><h2>管理员登录</h2><form id="login-form"><label for="password">管理员密码</label><input id="password" type="password" autocomplete="current-password" maxlength="256" required><button type="submit">登录</button></form></section>
<div id="workspace" hidden><section><div class="row"><h2>添加设备</h2><button id="logout" class="secondary">退出登录</button></div><form id="pair-form"><label for="device-name">设备名称</label><div class="row"><input id="device-name" maxlength="40" placeholder="例如：我的对讲机" required><button type="submit">生成配对码</button></div></form><div id="pair-result" hidden><p>配对码仅显示在本页，有效期 10 分钟，使用一次后失效。交给设备配对流程使用，请勿公开。</p><output id="pair-code"></output><p id="pair-expiry"></p></div></section>
<section><div class="row"><h2>设备列表</h2><button id="refresh" class="secondary">刷新</button></div><p>撤销后该凭证立即失效；重新配对才能恢复访问。</p><ul id="devices"></ul></section>
<section><h2>房间与文字消息</h2>
<form id="room-form"><label for="room-name">新房间名称</label><div class="row"><input id="room-name" maxlength="40" required placeholder="例如：朋友频道"><button type="submit">创建房间</button></div></form>
<label for="room-select">当前房间</label><select id="room-select"><option value="">请选择房间</option></select>
<div id="room-detail" hidden><div class="row"><h3>房间成员</h3><button id="archive-room" class="secondary">归档房间</button></div>
<p>勾选即加入房间。新成员只收到加入后发送的消息；移除后停止投递旧消息。</p><div id="room-members"></div>
<form id="message-form"><label for="message-text">发送文字</label><textarea id="message-text" rows="4" maxlength="400" required placeholder="最多 200 个字符"></textarea><div class="row"><span id="text-count">0 / 200</span><button id="send-text" type="submit">发送到房间</button></div></form>
<div class="row"><h3>消息记录</h3><button id="refresh-messages" class="secondary">刷新记录</button></div><p>待接收表示已保存至服务端；接收与已读状态以设备回执为准。</p><ul id="message-history"></ul><button id="older-messages" class="secondary" hidden>加载更早消息</button></div>
</section></div>
<footer>文字可发送至已配对的房间成员；设备收信固件与语音对讲仍在开发。</footer></main></body></html>
