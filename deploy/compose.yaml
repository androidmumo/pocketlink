name: pocketlink-prod
services:
  relay:
    image: ${POCKETLINK_IMAGE:?Set POCKETLINK_IMAGE to a validated image digest}
    restart: unless-stopped
    init: true
    user: "65532:65532"
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 128
    mem_limit: 192m
    cpus: 0.5
    stop_grace_period: 15s
    environment:
      POCKETLINK_LISTEN: 0.0.0.0:8080
      POCKETLINK_DATABASE: /data/relay.db
      POCKETLINK_LOG_LEVEL: ${POCKETLINK_LOG_LEVEL:-info}
      POCKETLINK_SHUTDOWN_TIMEOUT: 10s
      GOMEMLIMIT: 128MiB
    ports:
      - "127.0.0.1:${POCKETLINK_HTTP_PORT:-18080}:8080/tcp"
    volumes:
      - data:/data
    tmpfs:
      - /tmp:size=8m,mode=1777
    healthcheck:
      test: [CMD, /relay, healthcheck]
      interval: 30s
      timeout: 3s
      start_period: 10s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: 5m
        max-file: "3"
volumes:
  data:
